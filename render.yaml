services:
  - type: worker
    name: exitant-fibo-rr-hl
    runtime: image
    plan: starter
    region: oregon
    numInstances: 1
    image:
      url: docker.io/exitant/exitant-fibo-rr-hl:5
    disk:
      name: fibo-rr-hl-state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HYPE_WALLET_API
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
